name: Contract Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  contract-tests:
    name: OpenAPI Contract Testing
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audituser
          POSTGRES_PASSWORD: auditpass
          POSTGRES_DB: auditdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run database migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://audituser:auditpass@localhost:5432/auditdb
        run: |
          # Run Alembic migrations
          alembic upgrade head
      
      - name: Start FastAPI server
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://audituser:auditpass@localhost:5432/auditdb
          SECRET_KEY: test-secret-key-for-ci
        run: |
          # Start server in background
          python -m app.presentation.main &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          
          # Wait for server to be ready
          timeout 30 bash -c 'until curl -f http://localhost:8000/health; do sleep 1; done'
      
      - name: Run contract tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://audituser:auditpass@localhost:5432/auditdb
        run: |
          pytest -v -m contract app/tests/contract/
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps
      
      - name: Generate TypeScript types from OpenAPI
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
        run: npm run api:gen:ci
      
      - name: Upload generated types
        uses: actions/upload-artifact@v4
        with:
          name: openapi-types
          path: frontend/src/lib/api/types.gen.ts
          retention-days: 7
      
      - name: Stop FastAPI server
        if: always()
        run: |
          if [ ! -z "$SERVER_PID" ]; then
            kill $SERVER_PID || true
          fi
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: |
            backend/htmlcov/
            backend/.coverage
          retention-days: 7

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: contract-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps
      
      - name: Download generated types
        uses: actions/download-artifact@v4
        with:
          name: openapi-types
          path: frontend/src/lib/api/
      
      - name: TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit
      
      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

name: auditorbit-ci

on:
  push:
    branches: [ master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: auditpw
          POSTGRES_DB: auditdb
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U audit" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api/requirements.txt
      - run: |
          cd api
          alembic -c alembic.ini upgrade head
          pytest -q || true

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd web && pnpm i
      - run: cd web && pnpm dlx playwright install --with-deps
      - run: cd web && pnpm test:e2e || true

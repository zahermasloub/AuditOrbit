name: ui-perf-visual

on:
  push:
    branches: [ master ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd web && pnpm i && pnpm perf:lhci
      - name: Upload LH report
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: web/.lighthouse

  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd web && pnpm i
      - run: cd web && pnpm dlx playwright install --with-deps
      - run: cd web && pnpm test:visual
      - name: Upload snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: web/tests/visual/__screenshots__
